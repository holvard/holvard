name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories appear without any commit: re-run deny and audit weekly.
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Reference age release used by the cross-check, with its SHA-256.
  AGE_VERSION: v1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10

# The Rust toolchain comes only from rust-toolchain.toml: the runners' rustup
# installs it with `rustup toolchain install`, so CI cannot drift from it.
# Third-party actions are pinned to full commit SHAs; the comment names the tag.
jobs:
  build:
    name: Build and test (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && cargo --version
      - run: cargo build --locked --all-targets
      - run: cargo test --locked

  lint:
    name: fmt, clippy, licensing
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && cargo --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install REUSE
        run: pip install --require-hashes -r scripts/reuse/requirements.txt
      - name: reuse lint (every file has license information)
        run: reuse lint
      - name: SPDX headers match their directories
        run: scripts/check-spdx.sh

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && cargo --version
      # A prebuilt binary, not cargo-deny-action: that action builds a Docker
      # image from Docker Hub, which hits its anonymous pull rate limit.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && cargo --version
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings

  cross-check:
    name: Cross-check against age and SLIP-39 reference
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install && cargo --version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install age ${{ env.AGE_VERSION }}
        run: |
          tarball="age-${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/${tarball}"
          echo "${AGE_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}"
          echo "$PWD/age" >> "$GITHUB_PATH"
      - name: Install SLIP-39 reference
        run: pip install --require-hashes -r scripts/cross-check/requirements.txt
      - run: cargo build --locked --release
      - run: scripts/cross-check.sh

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-off
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/check-dco.sh "$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scripts/check-dco.sh "$BEFORE..$AFTER"
          else
            # First push (before is all zeros) or force-push (old tip gone):
            # nothing to compare against, so check the whole history.
            scripts/check-dco.sh "$AFTER"
          fi
