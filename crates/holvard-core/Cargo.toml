[package]
name = "holvard-core"
description = "Holvard core: vault encryption with age, SLIP-39 key splitting and card encoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
getrandom = "0.4"
hmac = { version = "0.13", features = ["zeroize"] }
pbkdf2 = "0.13"
sha2 = { version = "0.11", features = ["zeroize"] }
zeroize = "1.9"

[lints]
workspace = true
