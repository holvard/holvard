[workspace]
resolver = "3"
members = ["crates/holvard-core", "crates/holvard-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/holvard/holvard"
homepage = "https://holvard.dev"
authors = ["Holvard contributors"]

[workspace.dependencies]
holvard-core = { path = "crates/holvard-core", version = "0.0.0" }
zeroize = "1.9"
# Deflate only (pure Rust, via flate2 and zlib-rs): no zip encryption, no
# other compression methods, no time handling. Approved 2026-10-15.
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Ctrl-C handling, so the terminal is restored when cards are on screen.
# Only the signal iterator. Approved 2026-10-16.
signal-hook = { version = "0.4.5", default-features = false, features = ["iterator"] }
# Folder handles and no-follow opens for the walk in holvard create
# (openat, fstat). Chosen over nix for its stable 1.x API. Approved 2026-10-22.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

# Everything is deny, not warn: CI builds with -D warnings, so a warning
# here would pass locally and fail in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

# scrypt at age's work factor 18 takes minutes without optimisation, which
# makes the vault tests too slow in debug builds. Only these crates are
# optimised; Holvard's own code still builds as plain debug.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
